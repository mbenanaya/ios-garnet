# socs/sm7435/soc.conf: the Qualcomm SM7435 family (Snapdragon 7s Gen 2 / SM7435-AB, "parrot").
# A phone with this SoC includes configs/sm7435.config from its defconfig.
#
# Credits: this SoC layer was first written by Montfort (github.com/JosephMontfort) for HakiOS's POCO X6 5G port.

soc sm7435
	title       Qualcomm SM7435 family (Snapdragon 7s Gen 2 / SM7435-AB, "parrot")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 710
	maintainer  Rafsan (github.com/rafsanbasunia)
